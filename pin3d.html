<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<title>O Primeiro Pin — versão digital</title>
<style>
:root{
  --void:#0B0A09;
  --void-2:#141110;
  --parch-1:#EFDDB8;
  --parch-3:#B99A66;
  --rotaract:#D4145A;
  --gold:#C8A035;
  --gold-lit:#EFCE79;
  --display:'Didot','Bodoni MT','Playfair Display',Georgia,serif;
  --body:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --util:'Futura','Avenir Next','Century Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 38%,#1B1509 0%,var(--void) 70%);
  color:var(--parch-1);font-family:var(--body);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.kicker{
  font-family:var(--util);font-size:10px;letter-spacing:.38em;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;
}
h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(24px,6vw,40px);letter-spacing:.05em;line-height:1.25;
  margin-bottom:6px;
}
.sub{color:var(--parch-3);font-size:clamp(13.5px,3.4vw,15.5px);line-height:1.7;max-width:44ch;margin-bottom:8px}
#palco{
  position:relative;
  width:min(92vw,560px);height:min(52svh,430px);
  touch-action:none;
}
#palco::before{
  content:"";position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(circle,rgba(200,160,53,.16),transparent 62%);
  pointer-events:none;
}
#cena{width:100%;height:100%;display:block}
.hint{
  font-family:var(--util);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:#7A6449;margin-top:4px;line-height:2;
}
.motes{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.mote{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--gold-lit);opacity:0;filter:blur(.4px);
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translate3d(0,20px,0) scale(.4);opacity:0}
  12%{opacity:.5}
  88%{opacity:.3}
  100%{transform:translate3d(var(--dx,20px),-110px,0) scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){.motes{display:none}}
</style>
</head>
<body>

<div class="motes" id="motes"></div>
<div class="kicker">Caça ao Primeiro Pin</div>
<h1>É isto que você está buscando</h1>
<p class="sub">O primeiro pin do Rotaract — a versão digital do prêmio que espera por você no fim da trilha.</p>
<div id="palco"><canvas id="cena"></canvas></div>
<div class="hint">arraste para girar · o verso guarda uma surpresa</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(function(){
"use strict";

/* partículas de fundo */
(function(){
  var box=document.getElementById("motes");
  for(var i=0;i<24;i++){
    var m=document.createElement("span");
    m.className="mote";
    m.style.left=(Math.random()*100)+"%";
    m.style.top=(55+Math.random()*45)+"%";
    m.style.setProperty("--dx",(Math.random()*80-40)+"px");
    m.style.animationDuration=(7+Math.random()*9)+"s";
    m.style.animationDelay=(Math.random()*9)+"s";
    box.appendChild(m);
  }
})();

if(!window.THREE) return;

var palco=document.getElementById("palco");
var cv=document.getElementById("cena");
var W=palco.clientWidth, H=palco.clientHeight;

var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(W,H,false);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(35,W/H,.1,100);
camera.position.set(0,0,7.2);

/* ==========================================================
   AMBIENTE — reflexo de ourivesaria gerado em canvas
   (equiretangular: faixas quentes + brilhos, para o metal ter vida)
   ========================================================== */
(function(){
  var c=document.createElement("canvas");
  c.width=512; c.height=256;
  var x=c.getContext("2d");
  x.fillStyle="#171008"; x.fillRect(0,0,512,256);
  function blob(px,py,r,cor,a){
    var g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,cor); g.addColorStop(1,"rgba(0,0,0,0)");
    x.globalAlpha=a; x.fillStyle=g;
    x.fillRect(px-r,py-r,r*2,r*2);
    x.globalAlpha=1;
  }
  blob(120,52,110,"#FFFEF6",.95);      // luz principal (fria, puxando prata)
  blob(400,70,80,"#F2E9C8",.55);       // segunda luz champanhe
  blob(256,210,120,"#332818",.8);      // rebatida quente de baixo
  blob(480,180,70,"#D4145A",.2);       // toque magenta rotaract
  blob(40,190,60,"#948663",.4);
  x.fillStyle="rgba(255,252,240,.55)";
  x.fillRect(0,40,512,3);              // linha de horizonte luminosa
  var tex=new THREE.CanvasTexture(c);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  var pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
})();

/* ==========================================================
   A PLACA — dimensões tiradas da foto do pin real (~2,75:1)
   ========================================================== */
var PW=3.1, PH=1.25, RAIO=.22, PROF=.16, BISEL=.05;

function shapePlaca(w,h,r){
  var s=new THREE.Shape();
  var x=-w/2, y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);
  s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);
  s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);
  s.quadraticCurveTo(x,y,x+r,y);
  return s;
}

/* fundo dourado escovado, usado nas duas faces */
function canvasOuro(desenha){
  var c=document.createElement("canvas");
  c.width=1024; c.height=Math.round(1024*PH/PW);
  var x=c.getContext("2d");
  var g=x.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,"#F8F1DC");
  g.addColorStop(.42,"#EADDB6");
  g.addColorStop(.75,"#CFC091");
  g.addColorStop(1,"#B0A070");
  x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
  // escovado horizontal
  for(var i=0;i<340;i++){
    x.globalAlpha=.05;
    x.fillStyle=Math.random()>.5?"#FFFFFF":"#7d6f4a";
    var yy=Math.random()*c.height;
    x.fillRect(0,yy,c.width,Math.random()*1.4);
  }
  x.globalAlpha=1;
  // brilho suave no canto superior
  var rg=x.createRadialGradient(c.width*.25,c.height*.1,0,c.width*.25,c.height*.1,c.width*.5);
  rg.addColorStop(0,"rgba(255,255,250,.4)"); rg.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=rg; x.fillRect(0,0,c.width,c.height);
  if(desenha) desenha(x,c.width,c.height);
  var t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  // UVs do ExtrudeGeometry usam as coordenadas do shape → normaliza
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  t.repeat.set(1/PW,1/PH);
  t.offset.set(.5,.5);
  return t;
}

var matLados=new THREE.MeshStandardMaterial({color:0xDCCFA3,metalness:.95,roughness:.26});

function fazPlaca(texFrente){
  var geo=new THREE.ExtrudeGeometry(
    shapePlaca(PW-BISEL*2,PH-BISEL*2,RAIO),
    {depth:PROF,bevelEnabled:true,bevelThickness:BISEL,bevelSize:BISEL,bevelSegments:4,curveSegments:24}
  );
  geo.center();
  var matFace=new THREE.MeshStandardMaterial({
    map:texFrente,metalness:.9,roughness:.32
  });
  return new THREE.Mesh(geo,[matFace,matLados]);
}

var pin=new THREE.Group();
scene.add(pin);

/* FRENTE — a arte real do pin (PNG oficial em cranberry) */
var logo=new Image();
logo.crossOrigin="anonymous";
logo.onload=logo.onerror=function(){
  var ok=logo.naturalWidth>0;

  var texFrente=canvasOuro(function(x,w,h){
    if(ok){
      // logo centralizado, ~88% da largura (margens estreitas, como no pin real)
      var lw=w*.88, lh=lw*(logo.naturalHeight/logo.naturalWidth);
      if(lh>h*.82){ lh=h*.82; lw=lh*(logo.naturalWidth/logo.naturalHeight); }
      x.drawImage(logo,(w-lw)/2,(h-lh)/2,lw,lh);
    } else {
      // fallback: texto se o PNG não carregar
      x.fillStyle="#C10F45";
      x.font="700 "+Math.round(h*.42)+"px 'Futura','Avenir Next',sans-serif";
      x.textAlign="center"; x.textBaseline="middle";
      x.fillText("Rotaract",w/2,h/2);
    }
  });

  /* VERSO — gravação do clube (a surpresa) */
  var texVerso=canvasOuro(function(x,w,h){
    x.fillStyle="rgba(122,90,26,.9)";
    x.textAlign="center";
    x.font="600 "+Math.round(h*.155)+"px 'Futura','Avenir Next',sans-serif";
    x.save();
    // leve efeito de gravação: sombra clara deslocada
    x.shadowColor="rgba(255,243,196,.55)";
    x.shadowOffsetY=2;
    var ls=Math.round(w*.008);
    x.fillText("R O T A R A C T   C L U B",w/2,h*.30);
    x.fillText("J A R A G U Á   D O   S U L",w/2,h*.52);
    x.font="500 "+Math.round(h*.115)+"px 'Futura','Avenir Next',sans-serif";
    x.fillStyle="rgba(122,90,26,.75)";
    x.fillText("C A Ç A   A O   P R I M E I R O   P I N",w/2,h*.76);
    x.restore();
  });

  /* placa da frente + placa fina do verso (girada, para o texto não sair espelhado) */
  var frente=fazPlaca(texFrente);
  pin.add(frente);
  var geoVerso=new THREE.ExtrudeGeometry(
    shapePlaca(PW-BISEL*2-.02,PH-BISEL*2-.02,RAIO),
    {depth:.01,bevelEnabled:false,curveSegments:24}
  );
  geoVerso.center();
  var verso=new THREE.Mesh(geoVerso,new THREE.MeshStandardMaterial({map:texVerso,metalness:.9,roughness:.38}));
  verso.rotation.y=Math.PI;
  verso.position.z=-(PROF/2+BISEL+.006);
  pin.add(verso);
};
logo.src="images/Rotaract - Logo Cranberry Sem Fundo (centralizado).png";

/* luzes de apoio (o ambiente faz o grosso) */
scene.add(new THREE.AmbientLight(0x2e2312,.9));
var luzChave=new THREE.DirectionalLight(0xFFF9E8,1.15);
luzChave.position.set(2.5,3,4);
scene.add(luzChave);
var luzMagenta=new THREE.PointLight(0xD4145A,.22);
luzMagenta.position.set(-4,-1.5,2.5);
scene.add(luzMagenta);

/* ==========================================================
   INTERAÇÃO — arrastar com inércia + flutuação
   ========================================================== */
var GIRO_BASE=/[?&]parado/.test(location.search)?0:.012;
var velX=0, velY=GIRO_BASE, drag=null, t0=0;
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY};
});
cv.addEventListener("pointermove",function(e){
  if(!drag) return;
  velY=(e.clientX-drag.x)*.0035;
  velX=(e.clientY-drag.y)*.0035;
  pin.rotation.y+=velY;
  pin.rotation.x=Math.max(-1.1,Math.min(1.1,pin.rotation.x+velX));
  drag={x:e.clientX,y:e.clientY};
});
function solta(){ drag=null; }
cv.addEventListener("pointerup",solta);
cv.addEventListener("pointercancel",solta);

(function anima(ts){
  t0=ts||0;
  if(!drag){
    pin.rotation.y+=velY;
    pin.rotation.x=Math.max(-1.1,Math.min(1.1,pin.rotation.x+velX));
    velY+=(GIRO_BASE-velY)*.015;     // volta ao giro de vitrine
    velX+=(0-velX)*.03;
    pin.rotation.x+=(0-pin.rotation.x)*.006;
  }
  pin.position.y=Math.sin(t0*.0012)*.07;   // flutuação de relíquia
  renderer.render(scene,camera);
  requestAnimationFrame(anima);
})();

window.addEventListener("resize",function(){
  W=palco.clientWidth; H=palco.clientHeight;
  camera.aspect=W/H;
  camera.updateProjectionMatrix();
  renderer.setSize(W,H,false);
});
})();
</script>
</body>
</html>
